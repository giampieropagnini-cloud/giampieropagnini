<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Le combinazioni di tasti dei Pocket Operator PO-14 sub, PO-32 tonic, PO-33 K.O! e PO-35 speak.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F0EC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1D21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Op">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icona.png">
<link rel="icon" href="icona.png">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<title>Prontuario Pocket Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F1F0EC;
    --card:#FFFFFF;
    --ink:#15171A;
    --muted:#74786F;
    --rule:#D9D8D1;
    --rule-soft:#E7E6E0;
    --panel:#14161A;
    --panel-2:#1E2126;
    --silk:#EDEEE9;
    --silk-dim:#8D9189;
    --lcd:#B9C4A6;
    --lcd-ink:#22301C;
    --acc:#D33B34;
    --acc-ink:#FFFFFF;
    --acc-soft:rgba(211,59,52,.12);
    --shadow:0 1px 0 rgba(20,22,26,.05), 0 8px 24px -18px rgba(20,22,26,.5);
  }
  :root[data-po="sub"]{ --acc:#3757D8; --acc-soft:rgba(55,87,216,.12); }
  :root[data-po="tonic"]{ --acc:#D2601F; --acc-soft:rgba(210,96,31,.14); }
  :root[data-po="ko"]{ --acc:#D33B34; --acc-soft:rgba(211,59,52,.12); }
  :root[data-po="speak"]{ --acc:#0F7F74; --acc-soft:rgba(15,127,116,.14); }
  :root[data-po="tutti"]{ --acc:#4A4E55; --acc-soft:rgba(74,78,85,.12); }
  :root[data-po="midi"]{ --acc:#6E4FD0; --acc-soft:rgba(110,79,208,.12); }
  :root[data-po="tele"]{ --acc:#52700F; --acc-soft:rgba(82,112,15,.13); }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1A1D21;
      --card:#22262B;
      --ink:#ECEDE9;
      --muted:#9CA29B;
      --rule:#353A41;
      --rule-soft:#2B3036;
      --panel:#0A0C0F;
      --panel-2:#181B1F;
      --silk:#E4E6E0;
      --silk-dim:#7E837B;
      --lcd:#7E8C6D;
      --lcd-ink:#101A0C;
      --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
    }
    :root:not([data-theme="light"])[data-po="sub"]{ --acc:#7B96FF; --acc-soft:rgba(123,150,255,.16); }
    :root:not([data-theme="light"])[data-po="tonic"]{ --acc:#F0904A; --acc-soft:rgba(240,144,74,.16); }
    :root:not([data-theme="light"])[data-po="ko"]{ --acc:#FF6F65; --acc-soft:rgba(255,111,101,.16); }
    :root:not([data-theme="light"])[data-po="speak"]{ --acc:#3FC0B0; --acc-soft:rgba(63,192,176,.16); }
    :root:not([data-theme="light"])[data-po="tutti"]{ --acc:#A9AEB6; --acc-soft:rgba(169,174,182,.14); }
    :root:not([data-theme="light"])[data-po="midi"]{ --acc:#A993FF; --acc-soft:rgba(169,147,255,.16); --acc-ink:#101214; }
    :root:not([data-theme="light"])[data-po="tele"]{ --acc:#A9CF4F; --acc-soft:rgba(169,207,79,.15); --acc-ink:#101214; }
  }
  :root[data-theme="dark"]{
    --paper:#1A1D21; --card:#22262B; --ink:#ECEDE9; --muted:#9CA29B;
    --rule:#353A41; --rule-soft:#2B3036; --panel:#0A0C0F; --panel-2:#181B1F;
    --silk:#E4E6E0; --silk-dim:#7E837B; --lcd:#7E8C6D; --lcd-ink:#101A0C;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
  }
  :root[data-theme="dark"][data-po="sub"]{ --acc:#7B96FF; --acc-soft:rgba(123,150,255,.16); }
  :root[data-theme="dark"][data-po="tonic"]{ --acc:#F0904A; --acc-soft:rgba(240,144,74,.16); }
  :root[data-theme="dark"][data-po="ko"]{ --acc:#FF6F65; --acc-soft:rgba(255,111,101,.16); }
  :root[data-theme="dark"][data-po="speak"]{ --acc:#3FC0B0; --acc-soft:rgba(63,192,176,.16); }
  :root[data-theme="dark"][data-po="tutti"]{ --acc:#A9AEB6; --acc-soft:rgba(169,174,182,.14); }
  :root[data-theme="dark"][data-po="midi"]{ --acc:#A993FF; --acc-soft:rgba(169,147,255,.16); --acc-ink:#101214; }
  :root[data-theme="dark"][data-po="tele"]{ --acc:#A9CF4F; --acc-soft:rgba(169,207,79,.15); --acc-ink:#101214; }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3{ font-family:"Archivo",Helvetica,Arial,sans-serif; font-weight:600; letter-spacing:-.02em; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; }

  /* ---------- barra alta ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--paper);
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule);
  }
  .topbar-in{ max-width:1180px; margin:0 auto; padding:14px 16px 0; }
  .brandrow{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .brand{ font-size:19px; }
  .brand em{ font-style:normal; color:var(--muted); font-weight:500; }
  .brandnote{ font-size:12.5px; color:var(--muted); }
  .theme{ margin-left:auto; display:flex; border:1px solid var(--rule); border-radius:7px; overflow:hidden; background:var(--card); }
  .theme button{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.02em;
    border:none; background:transparent; color:var(--muted); padding:6px 10px; cursor:pointer;
  }
  .theme button + button{ border-left:1px solid var(--rule); }
  .theme button[aria-pressed="true"]{ background:var(--acc); color:var(--acc-ink); }
  .theme button:focus-visible{ outline:2px solid var(--acc); outline-offset:-2px; }
  .tabs{ display:flex; gap:6px; margin-top:12px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; border:1px solid var(--rule); border-bottom:none; background:var(--card);
    border-radius:7px 7px 0 0; padding:8px 13px 9px; cursor:pointer; color:var(--muted);
    font-family:"Archivo",Helvetica,Arial,sans-serif; font-size:13.5px; font-weight:600; letter-spacing:-.01em;
    display:flex; align-items:center; gap:8px; position:relative; top:1px;
  }
  .tab .dot{ width:9px; height:9px; border-radius:2px; background:currentColor; opacity:.55; }
  .tab[data-k="sub"] .dot{ background:#3757D8; }
  .tab[data-k="tonic"] .dot{ background:#D2601F; }
  .tab[data-k="ko"] .dot{ background:#D33B34; }
  .tab[data-k="speak"] .dot{ background:#0F7F74; }
  .tab[data-k="tutti"] .dot{ background:var(--muted); }
  .tab[data-k="midi"] .dot{ background:#6E4FD0; }
  .tab[data-k="tele"] .dot{ background:#52700F; }
  .tab:hover{ color:var(--ink); }
  .tab[aria-selected="true"]{ color:var(--ink); background:var(--paper); border-color:var(--rule); box-shadow:inset 0 3px 0 var(--acc); }
  .tab .sm{ font-weight:500; color:var(--muted); font-size:11.5px; }

  /* ---------- impaginato ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:22px 16px 64px; display:grid; gap:26px; grid-template-columns:1fr; }
  @media (min-width:980px){
    .wrap{ grid-template-columns:352px minmax(0,1fr); gap:34px; align-items:start; }
    .rail{ position:sticky; top:112px; }
  }
  .rail{ display:flex; flex-direction:column; gap:16px; min-width:0; }
  .content{ display:flex; flex-direction:column; gap:28px; min-width:0; }

  /* ---------- la macchina (disposizione reale) ---------- */
  .unit{ min-width:0; background:var(--panel); border-radius:12px; padding:13px; color:var(--silk); box-shadow:var(--shadow); }
  .silkrow{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--silk-dim); margin-bottom:8px;
  }
  .silkrow b{ color:var(--silk); font-weight:600; letter-spacing:.04em; }
  .lcd{
    background:var(--lcd); color:var(--lcd-ink); border-radius:4px; padding:8px 10px 9px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:10px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .lcd b{ font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:600; letter-spacing:.04em; }
  .lcd span{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.85; text-align:right; }

  .matrix{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:11px; }
  .cell{
    aspect-ratio:1/1; min-width:0; padding:2px; cursor:pointer;
    border:1px solid #343941; border-radius:5px; background:var(--panel-2); color:var(--silk-dim);
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.1; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    overflow:hidden; overflow-wrap:anywhere;
  }
  .cell.fn{ color:var(--silk); }
  .cell.knob{ border-radius:50%; border:2px solid var(--silk-dim); color:var(--silk); font-size:12px; font-weight:600; }
  .cell i{ font-style:normal; font-size:9px; opacity:.7; }
  .cell.tiny{ font-size:8.5px; letter-spacing:-.01em; }
  .cell:hover{ border-color:var(--silk); color:var(--silk); }
  .cell.on{ background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
  .cell.hi{ box-shadow:0 0 0 2px var(--acc); color:var(--silk); }
  .unit-cap{ font-size:11px; color:var(--silk-dim); margin:10px 0 0; text-align:center; letter-spacing:.02em; }
  .unit-cap b{ color:var(--silk); font-weight:600; }

  /* ---------- schede ---------- */
  .card{ background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:16px; }
  .spec{ display:flex; flex-direction:column; gap:0; }
  .spec div{ display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px dashed var(--rule-soft); font-size:13.5px; }
  .spec div:last-child{ border-bottom:none; }
  .spec dt{ color:var(--muted); }
  .spec b{ font-weight:600; text-align:right; min-width:0; overflow-wrap:anywhere; }

  h2.sec{ font-size:17px; display:flex; align-items:center; gap:10px; }
  h2.sec::after{ content:""; flex:1; height:1px; background:var(--rule); }
  .sec-note{ color:var(--muted); font-size:13px; margin:6px 0 0; max-width:62ch; }
  section > * + *{ margin-top:14px; }

  /* ---------- avvio rapido ---------- */
  .steps{ counter-reset:s; display:grid; gap:8px; grid-template-columns:1fr; }
  @media (min-width:640px){ .steps{ grid-template-columns:1fr 1fr; } }
  .step{
    counter-increment:s; background:var(--card); border:1px solid var(--rule); border-radius:10px;
    padding:12px 13px 13px 44px; position:relative; font-size:13.5px;
  }
  .step::before{
    content:counter(s); position:absolute; left:13px; top:12px;
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    width:21px; height:21px; border-radius:50%; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center;
  }
  .step > b{ display:block; font-weight:600; margin-bottom:3px; }
  .step .d{ color:var(--muted); }
  .step .d .kk{ color:var(--silk); font-size:11px; padding:2px 6px; }
  .steps .step:last-child:nth-child(odd){ grid-column:1 / -1; }

  /* ---------- combo ---------- */
  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .search{
    flex:1 1 220px; min-width:0; border:1px solid var(--rule); background:var(--card); color:var(--ink);
    border-radius:8px; padding:9px 12px; font:inherit; font-size:13.5px;
  }
  .search:focus-visible,.tab:focus-visible,.chipbtn:focus-visible,.cell:focus-visible,.theme button:focus-visible{
    outline:2px solid var(--acc); outline-offset:2px;
  }
  .chipbtn{
    border:1px solid var(--rule); background:var(--card); color:var(--muted); border-radius:8px;
    padding:9px 12px; font:inherit; font-size:13px; cursor:pointer;
  }
  .chipbtn:hover{ color:var(--ink); }
  .grp{ margin-top:18px; }
  .grp h3{ font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:7px; }
  .rows{ border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--card); }
  .row{
    display:grid; grid-template-columns:minmax(140px,205px) 1fr; gap:14px; align-items:start;
    padding:11px 13px; border-bottom:1px solid var(--rule-soft);
  }
  .row:last-child{ border-bottom:none; }
  .row:hover,.row.lit{ background:var(--acc-soft); }
  @media (max-width:600px){ .row{ grid-template-columns:1fr; gap:6px; } }
  .combo{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .kk{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
    background:var(--panel); color:var(--silk); border-radius:4px; padding:3px 7px; white-space:nowrap;
  }
  .kk.num{ background:transparent; color:var(--ink); border:1px solid var(--rule); }
  .plus{ color:var(--muted); font-size:11px; }
  .what{ font-size:13.5px; }
  .what i{ display:block; font-style:normal; color:var(--muted); font-size:12.5px; margin-top:2px; }
  .flag{
    display:inline-block; vertical-align:1px; margin-left:6px; font-family:"IBM Plex Mono",monospace;
    font-size:10px; letter-spacing:.04em; color:var(--muted); border:1px solid var(--rule); border-radius:3px; padding:0 4px;
  }
  .empty{ padding:18px 13px; color:var(--muted); font-size:13.5px; }

  /* ---------- griglia effetti ---------- */
  .fx{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:7px; }
  .fxi{ display:grid; grid-template-columns:24px 1fr; gap:9px; padding:9px 10px; border:1px solid var(--rule); border-radius:8px; background:var(--card); }
  .fxn{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; color:var(--acc); padding-top:1px; }
  .fxt{ font-size:13px; font-weight:600; }
  .fxt i{ display:block; font-style:normal; font-weight:400; color:var(--muted); font-size:12px; margin-top:1px; }
  .fxi.off .fxn{ color:var(--muted); }

  /* ---------- tabella confronto ---------- */
  .tablewrap{ overflow-x:auto; border:1px solid var(--rule); border-radius:10px; background:var(--card); }
  table{ border-collapse:collapse; width:100%; min-width:660px; font-size:13px; }
  th,td{ text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--rule-soft); }
  thead th{ position:sticky; top:0; background:var(--card); font-family:"Archivo",sans-serif; font-size:13px; border-bottom:1px solid var(--rule); }
  tbody th{ font-weight:500; color:var(--muted); white-space:nowrap; }
  tr:last-child td, tr:last-child th{ border-bottom:none; }
  .swatch{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:7px; vertical-align:1px; }

  /* iPhone: rispetta la tacca e il bordo arrotondato quando e' salvata sulla schermata */
  .topbar-in{ padding-top:calc(14px + env(safe-area-inset-top, 0px)); }
  .wrap{
    padding-left:calc(16px + env(safe-area-inset-left, 0px));
    padding-right:calc(16px + env(safe-area-inset-right, 0px));
    padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px));
  }
  @media (max-width:560px){
    .unit{ padding:11px; }
    .lcd{ padding:7px 9px; }
    .lcd b{ font-size:13.5px; }
    .lcd span{ font-size:9px; }
    .matrix{ gap:5px; }
    .cell{ font-size:9.5px; border-radius:4px; }
    .cell.tiny{ font-size:8px; }
    .cell.knob{ font-size:11px; }
    .card{ padding:13px; }
  }
  .chwrap{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; max-width:360px; }
  .chcol{ display:flex; flex-direction:column; gap:5px; }
  .chhead{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--acc); text-align:center; }
  .chcell{
    border:1px solid var(--rule); border-radius:6px; background:var(--card); text-align:center;
    padding:8px 0; font-family:"IBM Plex Mono",monospace; font-size:13px; font-variant-numeric:tabular-nums;
  }
  .note{ font-size:12.5px; color:var(--muted); max-width:70ch; }
  .note a{ color:var(--acc); }
  footer{ border-top:1px solid var(--rule); margin-top:8px; padding-top:16px; }
  footer .note + .note{ margin-top:8px; }

  /* ---------- scheda midi ---------- */
  .cell .nt{ display:none; font-size:12px; font-weight:600; color:var(--lcd); letter-spacing:0; line-height:1.1; }
  .unit.midi .cell .nt{ display:block; }
  .unit.midi .cell i{ display:none; }
  .unit.midi .cell.on .nt{ color:inherit; }
  .src{
    display:inline-block; vertical-align:1px; margin-left:6px; font-family:"IBM Plex Mono",monospace; font-style:normal;
    font-size:10px; letter-spacing:.04em; border-radius:3px; padding:0 4px; white-space:nowrap;
  }
  .src.doc{ color:var(--muted); background:var(--rule-soft); border:1px solid var(--rule); }
  .src.code{ color:var(--acc); border:1px solid var(--acc); }
  .flag.misura{ border-style:dashed; border-color:var(--muted); color:var(--ink); white-space:nowrap; font-style:normal; }
  code.cfg{ font-family:"IBM Plex Mono",monospace; font-size:.9em; background:var(--rule-soft); border-radius:3px; padding:0 4px; overflow-wrap:anywhere; }
  .what a,.note a,.sec-note a{ color:var(--acc); overflow-wrap:anywhere; }
  .notegrid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; max-width:420px; }
  .ng{ border:1px solid var(--rule); border-radius:6px; background:var(--card); text-align:center; padding:6px 2px; font-family:"IBM Plex Mono",monospace; }
  .ng small{ display:block; font-size:10px; color:var(--muted); letter-spacing:.02em; }
  .ng b{ font-size:15px; font-weight:600; color:var(--acc); font-variant-numeric:tabular-nums; }

  /* ---------- scheda telecomando ---------- */
  .wrap.solo{ grid-template-columns:minmax(0,1fr); }
  .wrap.solo .rail{ display:none; }
  .tele{ display:grid; gap:28px; grid-template-columns:minmax(0,1fr); grid-template-areas:"conn" "face" "combo" "log"; }
  .tl-conn{ grid-area:conn; min-width:0; }
  .tl-face-sec{ grid-area:face; min-width:0; }
  .tl-combo{ grid-area:combo; min-width:0; }
  .tl-log-sec{ grid-area:log; min-width:0; }
  @media (min-width:980px){
    .tele{ grid-template-columns:420px minmax(0,1fr); gap:28px 34px; grid-template-areas:"face conn" "face log" "face combo"; align-items:start; }
  }
  .tl-card > * + *{ margin-top:12px; }
  .tl-state{ margin:0; font-size:14.5px; font-weight:500; }
  .tl-msg{ margin:6px 0 0; font-size:13.5px; color:var(--acc); font-weight:500; }
  .tl-lab{ margin:0 0 6px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .tl-outs{ display:flex; flex-direction:column; gap:6px; }
  .tl-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tbtn{
    min-height:44px; border:1px solid var(--rule); background:var(--card); color:var(--ink); border-radius:8px;
    padding:10px 14px; font:inherit; font-size:14px; line-height:1.25; cursor:pointer; text-align:center;
    overflow-wrap:anywhere; touch-action:manipulation;
  }
  .tbtn:hover,.nbtn:hover{ border-color:var(--ink); }
  .tbtn.main,.tbtn[aria-pressed="true"]{ background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600; }
  .tbtn.out{ text-align:left; }
  .tbtn.sq{ min-width:48px; font-size:20px; padding:6px 12px; }
  .tbtn:focus-visible,.pad:focus-visible,.nbtn:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
  .tl-ch{ display:flex; align-items:center; gap:10px; }

        { g:"copiare e cancellare",k:["record","pattern"], t:"Cancella il pattern attivo", n:null },
        { g:"servizio",k:["pattern","write","pile"], t:"Reset di fabbrica", n:"Tieni pattern e write mentre infili le batterie. Invece di sfilare le pile puoi infilare un foglietto di carta sul polo negativo." }
      ],

             playText:"Suona la voce", playNote:"Su uno slot melodico i tasti la trasportano; su uno slot batteria ogni tasto è una fetta." },
      fxTitle:"fx 9-16: gli effetti — tieni <span class='kk'>fx</span> + un tasto",
      fx:[null,null,null,null,null,null,null,null,["stutter sweep","balbettio che si stringe"],["trance gate","cancello ritmico"],["half rate","metà velocità"],["16 bar build up","salita da 16 battute"],["6/8 quantise","riquantizza in 6/8"],["retrigger pattern","fa ripartire il pattern"],["reverse","al contrario"],["nessun effetto","pulisce / cancella l'effetto scritto"]],
      fxNote:null,
      voices:[["neutral","risintesi pulita della tua voce"],["autotune","intona le note sugli step"],["retro","voce a bassa risoluzione, anni 80"],["noise","versione inquietante"],["robot","intonazione fissa, robot"],["fifth","aggiunge la quinta sopra"],["vocoder","risonante, da vocoder"],["synth","portante a onda quadra"]],
      panels:[{
        title:"le pagine delle manopole — premi <span class='kk'>fx</span> per cambiarle",
        rows:[["ton","A intonazione","B formante"],["tri","A punto d'inizio","B velocità"],["tune (nascosta: fx+record+5)","A nota base","B bpm del suono"],["mix (nascosta: fx+record+6)","A quantità di rumore","B volume"]]

  };

  var ORDER = ["sub","tonic","ko","speak"];

  /* ---- costruisce l'elenco completo di ogni macchina ---- */
  ORDER.forEach(function(k){
    var d = DATA[k];
    var b = base({ top:d.topLabel, soundText:d.over.soundText, soundNote:d.over.soundNote, playText:d.over.playText, playNote:d.over.playNote });
    d.combos = b.concat(d.extra);
  });

  var GROUPS = ["suoni","campionare","suonare","pattern","scrivere","copiare e cancellare","trasferimento","segreti","tempo e volume","servizio"];

  /* ---- token → tasto sullo schema ---- */
  function tokenOf(label, dev){
    var l = String(label).toLowerCase();
    if(l === "a") return "A";
    if(l === "b") return "B";
    if(l === "fx") return "fx";
    if(l === "write") return "write";
    if(l === "sound") return "sound";
    if(l === "pattern") return "pattern";
    if(l === "bpm") return "bpm";
    if(l === "play") return "play";
    if(l === "top" || l === dev.topLabel) return "top";
    if(/^\d/.test(l) || l.indexOf("-") > -1) return "keys";
    return null;
  }
  function keyLabel(x, dev){ return x === "top" ? dev.topLabel : x; }

  /* aspetto: auto (segue il telefono), chiaro o scuro forzati */
  var THEMES = ["light","auto","dark"];
  function readTheme(){
    try{ var v = localStorage.getItem("po-theme"); return THEMES.indexOf(v) > -1 ? v : null; }
    catch(e){ return null; }
  }
  function markTheme(v){
    THEMES.forEach(function(t){
      var b = document.getElementById("th-" + t);
      if(b) b.setAttribute("aria-pressed", t === v ? "true" : "false");
    });
  }
  function applyTheme(v, remember){
    var root = document.documentElement;
    if(v === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", v);
    markTheme(v);
    if(remember){ try{ localStorage.setItem("po-theme", v); }catch(e){} }
  }
  /* all'apertura: se ha gia' scelto qui uso la sua scelta, altrimenti lascio
     stare il tema dell'app e mi limito a segnare il pulsante giusto */
  (function(){
    var saved = readTheme();
    if(saved) applyTheme(saved, false);
    else markTheme(document.documentElement.getAttribute("data-theme") || "auto");
  })();
  document.querySelector(".theme").addEventListener("click", function(e){
    var b = e.target.closest("[data-th]");
    if(b) applyTheme(b.dataset.th, true);
  });

  var state = { dev:"ko", lastDev:"ko", filter:null, q:"", midiSel:null };
  var elContent = document.getElementById("content");
  var elTabs = document.getElementById("tabs");
  var elMatrix = document.getElementById("matrix");
  var elUnit = document.getElementById("unit");
  var elWrap = document.getElementById("wrap");

  /* le schede: le quattro macchine, il confronto, l'adattatore MIDI e il telecomando */
  var TABS = ORDER.concat(["tutti","midi","tele"]);
  var BRANDNOTE = {
    midi:"tocca un tasto dello schema per vedere la sua nota",
    tele:"i tasti qui sotto mandano le note all'adattatore"
  };
  var BRANDNOTE_DEF = "tocca un tasto dello schema per vedere solo le sue combinazioni";

  /* La mappa MIDI dell'adattatore di Hanz Tech (firmware 3.4.3, canale 1):
     1-8 = note 68-75, 9-16 = note 60-67, poi i tasti funzione 76-82. */
  var FN_NOTE = { sound:76, pattern:77, play:78, top:79, fx:80, bpm:81, write:82 };
  function noteOfNum(n){ return n <= 8 ? 67 + n : 51 + n; }

  /* La macchina ha 23 tasti: sound, pattern e bpm in alto, le due manopole
     in alto a destra, i 16 tasti in un quadrato 4x4 e la colonna dei comandi
     a destra (il tasto proprio del modello, fx, play, write). */
  function cell(tok, label, glyph, cls, id, note){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cell" + (cls ? " " + cls : "");
    b.dataset.t = tok;
    b.dataset.id = id;
    var lb = document.createElement("span");
    lb.className = "lb";
    lb.textContent = label;
    b.appendChild(lb);
    if(glyph){
      var i = document.createElement("i");
      i.textContent = glyph;
      b.appendChild(i);
    }
    var nt = document.createElement("span");
    nt.className = "nt";
    nt.textContent = String(note);
    b.appendChild(nt);
    return b;
  }
  (function buildMatrix(){
    var rightCol = [
      { t:"top", id:"topbtn", label:"record" },
      { t:"fx", label:"fx" },
      { t:"play", label:"play", glyph:"\u25B6" },
      { t:"write", label:"write", glyph:"\u25CF" }
    ];
    elMatrix.appendChild(cell("sound", "sound", null, "fn", "sound", FN_NOTE.sound));
    elMatrix.appendChild(cell("pattern", "pattern", null, "fn", "pattern", FN_NOTE.pattern));
    elMatrix.appendChild(cell("bpm", "bpm", null, "fn", "bpm", FN_NOTE.bpm));
    elMatrix.appendChild(cell("A", "A", null, "knob", "A", "\u2014"));
    elMatrix.appendChild(cell("B", "B", null, "knob", "B", "\u2014"));
    for(var r = 0; r < 4; r++){
      for(var c = 1; c <= 4; c++){
        var n = r * 4 + c;
        elMatrix.appendChild(cell("keys", String(n), null, null, "n" + n, noteOfNum(n)));
      }
      var right = rightCol[r];
      var b = cell(right.t, right.label, right.glyph, "fn", right.t, FN_NOTE[right.t]);
      if(right.id) b.id = right.id;
      elMatrix.appendChild(b);
    }
  })();

  /* tab */
  TABS.forEach(function(k){
    var t = document.createElement("button");
    t.type = "button"; t.className = "tab"; t.dataset.k = k; t.setAttribute("role","tab");
    if(k === "tutti"){ t.innerHTML = '<span class="dot"></span>confronto'; }
    else if(k === "midi"){ t.innerHTML = '<span class="dot"></span>midi <span class="sm">adattatore</span>'; }
    else if(k === "tele"){ t.innerHTML = '<span class="dot"></span>telecomando <span class="sm">web midi</span>'; }
    else { t.innerHTML = '<span class="dot"></span>' + DATA[k].name + ' <span class="sm">' + DATA[k].tag + '</span>'; }
    t.addEventListener("click", function(){
      /* uscendo dal telecomando nessun tasto del PO deve restare gi\u00F9 */
      if(state.dev === "tele" && k !== "tele") tlReleaseAll(false, false);
      if(DATA[k]) state.lastDev = k;
      state.dev = k; state.filter = null; state.q = ""; state.midiSel = null;
      render();
    });
    elTabs.appendChild(t);
  });

  /* schema cliccabile */
  elUnit.addEventListener("click", function(e){
    var b = e.target.closest("[data-t]");
    if(!b || state.dev === "tutti" || state.dev === "tele") return;
    if(state.dev === "midi"){
      state.midiSel = (state.midiSel === b.dataset.id) ? null : b.dataset.id;
      renderMidiUnit();
      return;
    }
    state.filter = (state.filter === b.dataset.t) ? null : b.dataset.t;
    render();
  });

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  function comboHTML(c, dev){
    return c.k.map(function(x){
      if(x === "…") return '<span class="plus">…</span>';
      var lab = keyLabel(x, dev);
      var isNum = /^\d/.test(lab) || lab === "pile" || lab === "linguetta";
      return '<span class="kk' + (isNum ? " num" : "") + '">' + esc(lab) + '</span>';
    }).join('<span class="plus">+</span>');
  }

  function matches(c, dev){
    if(state.filter){
      var hit = c.k.some(function(x){ return tokenOf(x, dev) === state.filter; });
      if(!hit) return false;
    }
    if(state.q){
      var hay = (c.t + " " + (c.n||"") + " " + c.k.join(" ") + " " + c.g).toLowerCase();
      if(hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function renderUnit(dev){
    var tb = document.getElementById("topbtn");
    tb.querySelector(".lb").textContent = dev.topLabel;
    tb.classList.remove("tiny");
    document.getElementById("lcd1").textContent = dev.name;
    document.getElementById("lcd2").textContent = state.filter ? ("filtro · " + keyLabel(state.filter === "keys" ? "1-16" : state.filter, dev)) : dev.lcd;
    document.getElementById("unitcap").textContent = dev.keysCap;
    document.querySelectorAll("#unit [data-t]").forEach(function(b){
      b.classList.toggle("on", state.filter === b.dataset.t);
      b.classList.remove("hi");
    });
    document.getElementById("silkmodel").textContent = dev.name;
    document.getElementById("silkmic").textContent = dev.silk;
    var sp = document.getElementById("spec");
    sp.innerHTML = dev.spec.map(function(r){
      return '<div><dt>' + esc(r[0]) + '</dt><b>' + esc(r[1]) + '</b></div>';
    }).join("");
  }

  function highlight(c, dev, on){
    if(!c) return;
    var toks = {};
    c.k.forEach(function(x){ var t = tokenOf(x, dev); if(t) toks[t] = 1; });
    document.querySelectorAll("#unit [data-t]").forEach(function(b){
      b.classList.toggle("hi", !!(on && toks[b.dataset.t]) && state.filter !== b.dataset.t);
    });
  }

  function renderDevice(k){
    var dev = DATA[k];
    document.documentElement.setAttribute("data-po", k);
    renderUnit(dev);

    var html = "";

    /* avvio rapido */
    var quanti = ["", "una", "due", "tre", "quattro", "cinque", "sei", "sette"][dev.steps.length] || dev.steps.length;
    html += '<section><h2 class="sec">le prime ' + quanti + ' mosse</h2>';
    html += '<div class="steps">' + dev.steps.map(function(s){
      return '<div class="step"><b>' + s[0] + '</b><span class="d">' + s[1] + '</span></div>';
    }).join("") + '</div></section>';

    /* i quattro canali */
    if(dev.channels){
      html += '<section><h2 class="sec">i quattro canali</h2><p class="sec-note">' + dev.channels.note + '</p><div class="chwrap">';
      for(var c = 0; c < 4; c++){
        html += '<div class="chcol"><div class="chhead">canale ' + (c+1) + '</div>';
        for(var r = 0; r < 4; r++) html += '<div class="chcell">' + (r * 4 + c + 1) + '</div>';
        html += '</div>';
      }
      html += '</div><p class="note">' + dev.channels.after + '</p></section>';
    }

    /* combo */
    var list = dev.combos.filter(function(c){ return matches(c, dev); });
    html += '<section><h2 class="sec">tutte le combinazioni</h2>';
    html += '<div class="toolbar">' +
            '<input class="search" id="q" type="search" placeholder="cerca: cancella, swing, campione, sveglia…" value="' + esc(state.q) + '" autocomplete="off">' +
            (state.filter || state.q ? '<button class="chipbtn" id="clr" type="button">mostra tutto</button>' : '') +
            '</div>';
    if(state.filter){
      html += '<p class="sec-note">Stai vedendo solo le combinazioni che usano <b>' + esc(keyLabel(state.filter === "keys" ? "i tasti 1-16" : state.filter, dev)) + '</b>. ' + list.length + ' su ' + dev.combos.length + '.</p>';
    }
    if(!list.length){
      html += '<div class="rows"><p class="empty">Niente da mostrare con questo filtro.</p></div>';
    } else {
      GROUPS.forEach(function(g){
        var rows = list.filter(function(c){ return c.g === g; });
        if(!rows.length) return;
        html += '<div class="grp"><h3>' + g + '</h3><div class="rows">';
        rows.forEach(function(c){
          var idx = dev.combos.indexOf(c);
          html += '<div class="row" data-i="' + idx + '" tabindex="0">' +
                  '<div class="combo">' + comboHTML(c, dev) + '</div>' +
                  '<div class="what">' + esc(c.t) + (c.soft ? '<span class="flag" title="riportato dalla community, non dal manuale ufficiale">da confermare</span>' : '') +
                  (c.n ? '<i>' + esc(c.n) + '</i>' : '') + '</div></div>';
        });
        html += '</div></div>';
      });
    }
    html += '</section>';

    /* voci del PO-35 */
    if(dev.voices){
      html += '<section><h2 class="sec">gli 8 stili di voce</h2>' +
              '<p class="sec-note">Tieni <span class="kk">fx</span> e premi 1-8. Ogni suono può avere il suo stile: con <b>write</b> acceso lo stile resta scritto nel pattern.</p><div class="fx">' +
              dev.voices.map(function(v,i){
                return '<div class="fxi"><div class="fxn">' + (i+1) + '</div><div class="fxt">' + esc(v[0]) + '<i>' + esc(v[1]) + '</i></div></div>';
              }).join("") + '</div></section>';
    }

    /* effetti */
    html += '<section><h2 class="sec">gli effetti</h2><p class="sec-note">' + dev.fxTitle + '. Valgono finché tieni premuto: sono da suonare, non da programmare — a meno che <b>write</b> non sia acceso.</p><div class="fx">' +
      dev.fx.map(function(f,i){
        if(!f) return "";
        return '<div class="fxi' + (i === 15 ? " off" : "") + '"><div class="fxn">' + (i+1) + '</div><div class="fxt">' + esc(f[0]) + '<i>' + esc(f[1]) + '</i></div></div>';
      }).join("") + '</div>' + (dev.fxNote ? '<p class="note">' + esc(dev.fxNote) + '</p>' : '') + '</section>';

    /* pagine manopole */
    (dev.panels || []).forEach(function(p){
      html += '<section><h2 class="sec">le manopole</h2><p class="sec-note">' + p.title + '</p><div class="rows">' +
        p.rows.map(function(r){
          return '<div class="row"><div class="combo"><span class="kk">' + esc(r[0]) + '</span></div><div class="what">' + esc(r[1]) + '<i>' + esc(r[2]) + '</i></div></div>';
        }).join("") + '</div></section>';
    });

    /* sync + note */
    html += syncSection();
    html += sources();

    elContent.innerHTML = html;

    var q = document.getElementById("q");
    if(q){
      q.addEventListener("input", function(){ state.q = q.value; render(true); });
    }
    var clr = document.getElementById("clr");
    if(clr) clr.addEventListener("click", function(){ state.filter = null; state.q = ""; render(); });

    elContent.querySelectorAll(".row[data-i]").forEach(function(r){
      var c = dev.combos[+r.dataset.i];
      var on = function(){ r.classList.add("lit"); highlight(c, dev, true); };
      var off = function(){ r.classList.remove("lit"); highlight(c, dev, false); };
      r.addEventListener("mouseenter", on); r.addEventListener("mouseleave", off);
      r.addEventListener("focus", on); r.addEventListener("blur", off);
    });
  }

  function syncSection(){
    var m = [
      ["SY0","niente sync: entrata e uscita sono audio stereo. È il modo in cui si accende."],
      ["SY1","entra stereo, esce mono + sync. È il modo del master che comanda gli altri."],
      ["SY2","entra il sync, esce stereo. È il modo dell'ultima macchina della catena."],
      ["SY3","entra il sync, esce mono + sync."],
      ["SY4","entra mono + sync, esce stereo."],
      ["SY5","entra mono + sync, esce mono + sync. È il modo di chi sta in mezzo alla catena."]
    ];
    return '<section><h2 class="sec">metterli a tempo fra loro</h2>' +
      '<p class="sec-note">Tieni il tasto in alto a destra (<b>record</b> sul K.O! e sullo Speak, <b>acc</b> sul Tonic, <b>style</b> sul Sub) e tocca <b>bpm</b> finché non compare la sigla. Il sync viaggia sul canale sinistro del cavo jack a 2 impulsi per quarto, lo stesso delle Volca. Serve un cavo stereo fra le due macchine.</p>' +
      '<div class="rows">' + m.map(function(r){
        return '<div class="row"><div class="combo"><span class="kk">' + r[0] + '</span></div><div class="what">' + esc(r[1]) + '</div></div>';
      }).join("") + '</div>' +
      '<p class="note">In pratica: la macchina che comanda va su <b>SY1</b>, l\'ultima della fila su <b>SY2</b>, tutte quelle in mezzo su <b>SY5</b>.</p></section>';
  }

  function sources(){
    return '<footer><p class="note">Dati presi dalle guide ufficiali teenage engineering (po-14, po-32, po-33, po-35), dai manuali estesi della community (Cubeleco, lode/PO-33) e, per le funzioni nascoste dello Speak, dal forum di Sonic Charge, dove le ha elencate chi l\'ha programmata. Dove le fonti non concordano trovi il segno <span class="flag">da confermare</span>: il display della macchina resta l\'ultima parola.</p></footer>';
  }

  function renderCompare(){
    document.documentElement.setAttribute("data-po", "tutti");
    document.getElementById("lcd1").textContent = "confronto";
    document.getElementById("lcd2").textContent = "quattro macchine";
    var tb = document.getElementById("topbtn");
    tb.querySelector(".lb").textContent = "record acc style";
    tb.classList.add("tiny");
    document.getElementById("silkmodel").textContent = "pocket operator";
    document.getElementById("silkmic").textContent = "quattro macchine, stessa pulsantiera";
    document.getElementById("unitcap").textContent = "i 16 tasti cambiano mestiere su ogni macchina";
    document.querySelectorAll("#unit [data-t]").forEach(function(b){ b.classList.remove("on","hi"); });
    var sp = document.getElementById("spec");
    sp.innerHTML = [
      ["tutte hanno","16 tasti, 16 pattern, 2 manopole"],
      ["tutte fanno","sound · pattern · bpm · write · fx · play"],
      ["cambia","il tasto in alto a destra"],
      ["cambia","cosa fa fx"]

  /* ================= scheda midi: l'adattatore di Hanz Tech =================
     Fonte di tutto: bobina/PO-RICERCA.md. Ogni riga porta da dove viene. */

  function src(k){
    if(k === "doc") return "<span class='src doc'>documentato</span>";
    if(k === "code") return "<span class='src code'>dal codice</span>";
    return "<span class='flag misura'>da misurare</span>";
  }
  function marks(m){ return (m || []).map(src).join(""); }
  function kk(x){ return "<span class='kk'>" + esc(x) + "</span>"; }
  function kn(x){ return "<span class='kk num'>" + esc(x) + "</span>"; }
  var PL = "<span class='plus'>+</span>";
  function cfg(x){ return "<code class='cfg'>" + esc(x) + "</code>"; }
  function link(href, text){ return "<a href='" + href + "' target='_blank' rel='noopener'>" + text + "</a>"; }
  function mrow(left, text, m, note){
    return "<div class='row'><div class='combo'>" + left + "</div><div class='what'>" + text + marks(m) +
           (note ? "<i>" + note + "</i>" : "") + "</div></div>";
  }
  function step(title, text){ return "<div class='step'><b>" + title + "</b><span class='d'>" + text + "</span></div>"; }

  function midiSelText(){
    var s = state.midiSel;
    if(!s) return "tocca un tasto";
    if(s === "A" || s === "B") return "manopola " + s + " · non via midi";
    if(s.charAt(0) === "n"){ var n = +s.slice(1); return "tasto " + n + " = nota " + noteOfNum(n); }
    return (s === "top" ? "tasto in alto" : s) + " = nota " + FN_NOTE[s];
  }

  function renderMidiUnit(){
    var tb = document.getElementById("topbtn");
    tb.querySelector(".lb").textContent = "record acc style";
    tb.classList.add("tiny");
    document.getElementById("silkmodel").textContent = "po midi adapter";
    document.getElementById("silkmic").textContent = "hanz tech · canale 1";
    document.getElementById("lcd1").textContent = "midi · ch 1";
    document.getElementById("lcd2").textContent = midiSelText();
    document.getElementById("unitcap").textContent = "su ogni tasto la sua nota midi";
    document.querySelectorAll("#unit [data-t]").forEach(function(b){
      b.classList.toggle("on", !!state.midiSel && b.dataset.id === state.midiSel);
      b.classList.remove("hi");
    });
  }

  /* ================= scheda telecomando: Web MIDI =================

     premuto: i tasti funzione si agganciano, i numeri fanno un tocco. */

  var TL_STEP = 25;   /* ms fra un passo e l'altro delle combinazioni */
  var TL_TAP = 60;    /* ms di un tocco */
  var TL_VEL = 100;
  var TL_AUTO = /teensy|po_midi|po-ma/i;
  var tele = { access:null, outs:[], out:null, lastId:null, ch:1, held:[], busy:0, nums:false, model:null, log:[], msg:"" };

  function tlSupported(){ return typeof navigator !== "undefined" && typeof navigator.requestMIDIAccess === "function"; }
  function tlHex(bytes){ return bytes.map(function(x){ return (x < 16 ? "0" : "") + x.toString(16).toUpperCase(); }).join(" "); }
  function tlName(n){
    if(n >= 60 && n <= 75) return "tasto " + (n >= 68 ? n - 67 : n - 51);
    var names = { 76:"sound", 77:"pattern", 78:"play", 79:DATA[tele.model || "ko"].topLabel, 80:"fx", 81:"bpm", 82:"write" };
    return names[n] || ("nota " + n);
  }
  function tlIsHeld(n){ return tele.held.indexOf(n) > -1; }
  function tlStart(){ return Math.max(performance.now(), tele.busy); }

  function tlSend(bytes, at, what){
    if(!tele.out) return false;
    try{ tele.out.send(bytes, at); }
    catch(err){
      tele.msg = "Il messaggio non è partito: " + (err && err.message ? err.message : err);
      tlPaint();
      return false;
    }
    tele.log.push(tlHex(bytes) + " · " + what);
    while(tele.log.length > 8) tele.log.shift();
    return true;
  }
  function tlOn(n, at){ return tlSend([0x90 | (tele.ch - 1), n, TL_VEL], at, tlName(n) + " giù"); }
  function tlOff(n, at){ return tlSend([0x80 | (tele.ch - 1), n, 0], at, tlName(n) + " su"); }

  function tlNeedOut(){
    if(!tlSupported()) tele.msg = "In questo browser il telecomando non può mandare niente.";
    else if(!tele.access) tele.msg = "Prima premi «collega».";
    else tele.msg = "Prima scegli l'uscita dell'adattatore.";
    tlPaint();
  }
  function tlFlash(el){
    if(!el) return;
    el.classList.add("tap");
    setTimeout(function(){ el.classList.remove("tap"); }, 180);
  }

  /* un tasto della faccia: se è giù lo lascia, altrimenti aggancia o fa un tocco */
  function tlPad(n, kind, el){
    if(!tele.out){ tlNeedOut(); return; }
    tele.msg = "";
    var t = tlStart();
    if(tlIsHeld(n)){
      tlOff(n, t);
      tele.held.splice(tele.held.indexOf(n), 1);
      tele.busy = t + TL_STEP;
    } else if(kind === "fn" || (kind === "num" && tele.nums)){
      if(tlOn(n, t)) tele.held.push(n);
      tele.busy = t + TL_STEP;
    } else {
      if(tlOn(n, t)) tlOff(n, t + TL_TAP);
      tele.busy = t + TL_TAP + TL_STEP;
      tlFlash(el);
    }
    tlPaint();
  }
  /* un tocco singolo, per «tempo preset» */
  function tlTap(n, el){
    if(!tele.out){ tlNeedOut(); return; }
    tele.msg = "";
    if(tlIsHeld(n)){ tele.msg = "«" + tlName(n) + "» è già giù: toccalo sulla faccia per lasciarlo."; tlPaint(); return; }
    var t = tlStart();
    if(tlOn(n, t)) tlOff(n, t + TL_TAP);
    tele.busy = t + TL_TAP + TL_STEP;
    tlFlash(el);
    tlPaint();
  }
  /* una combinazione: giù in ordine, su al contrario, 25 ms fra un passo e l'altro.
     Se il primo tasto è già agganciato non lo ripreme e non lo lascia. */
  function tlCombo(seq, el){
    if(!tele.out){ tlNeedOut(); return; }
    tele.msg = "";
    for(var i = 1; i < seq.length; i++){
      if(tlIsHeld(seq[i])){ tele.msg = "Prima lascia «" + tlName(seq[i]) + "»: è ancora giù."; tlPaint(); return; }
    }
    var press = seq.filter(function(n){ return !tlIsHeld(n); });
    var t = tlStart(), k = 0;
    press.forEach(function(n){ tlOn(n, t + TL_STEP * k++); });
    press.slice().reverse().forEach(function(n){ tlOff(n, t + TL_STEP * k++); });
    tele.busy = t + TL_STEP * k;
    tlFlash(el);
    tlPaint();
  }
  /* Note Off a tutti i tasti agganciati, l'ultimo agganciato per primo */
  function tlReleaseAll(now, fromUser){
    if(!tele.held.length){
      if(fromUser){ tele.msg = "Nessun tasto è agganciato."; tlPaint(); }
      return;
    }
    if(!tele.out){ if(fromUser) tlNeedOut(); return; }
    var t = tlStart(), gap = now ? 0 : TL_STEP;
    tele.held.slice().reverse().forEach(function(n, i){ tlOff(n, t + gap * i); });
    tele.busy = t + gap * tele.held.length + TL_STEP;
    tele.held = [];
    if(fromUser) tele.msg = "";
    tlPaint();
  }
  function tlChannel(d){
    var c = Math.min(16, Math.max(1, tele.ch + d));
    if(c === tele.ch) return;
    if(tele.out) tlReleaseAll(false, false); else tele.held = [];
    tele.ch = c;
    tlPaint();
  }
  function tlUse(o){
    if(tele.out && tele.out.id === o.id) return;
    if(tele.out) tlReleaseAll(false, false);
    if(o.id !== tele.lastId) tele.held = [];
    tele.out = o; tele.lastId = o.id; tele.msg = "";
  }
  function tlPick(id){
    var o = null;
    tele.outs.forEach(function(x){ if(x.id === id) o = x; });
    if(!o) return;
    tlUse(o);
    tlPaint();
  }
  function tlRefresh(){
    if(!tele.access) return;
    var list = [];
    tele.access.outputs.forEach(function(o){ if(o.state !== "disconnected") list.push(o); });
    tele.outs = list;
    if(tele.out && !list.some(function(o){ return o.id === tele.out.id; })){
      tele.out = null;
      tele.msg = tele.held.length ? "L'uscita si è staccata. Quando torna, premi «lascia tutto»: un tasto del PO potrebbe essere rimasto giù." : "L'uscita si è staccata.";
    }
    if(!tele.out){
      var pick = null;
      list.forEach(function(o){ if(o.id === tele.lastId) pick = o; });
      if(!pick) list.forEach(function(o){ if(!pick && TL_AUTO.test(o.name || "")) pick = o; });
      if(pick) tlUse(pick);
    }
    tlPaintOuts();
    tlPaint();
  }
  function tlConnect(){
    if(!tlSupported()){ tlPaint(); return; }
    tele.msg = "Il browser chiede il permesso di usare il MIDI…";
    tlPaint();
    var fail = function(err){
      tele.msg = "Il browser non ha dato il permesso" + (err && err.name ? " (" + err.name + ")" : "") + ". Premi di nuovo «collega» e rispondi «consenti».";
      tlPaint();
    };
    try{
      navigator.requestMIDIAccess({ sysex:false }).then(function(acc){
        tele.access = acc;
        tele.msg = "";
        acc.onstatechange = function(){ tlRefresh(); };
        tlRefresh();
      }, fail);
    }catch(err){ fail(err); }
  }

  function tlStatus(){
    if(!tlSupported()) return "Questo browser non ha il MIDI. Safari, anche su iPhone, non lo ha: usa Chrome o Edge sul Mac. Sull'iPhone c'è l'app Bobina.";
    if(!tele.access) return "MIDI spento. Premi «collega»: il browser chiede il permesso.";
    if(!tele.outs.length) return "Nessuna uscita MIDI. Accendi l'adattatore e collega il cavo USB, oppure il bluetooth (vedi sotto).";
    if(!tele.out) return "Scegli qui sotto l'uscita dell'adattatore.";
    return "Collegato a «" + (tele.out.name || "uscita senza nome") + "» · canale " + tele.ch + ".";
  }

  function tlPaintOuts(){
    if(state.dev !== "tele") return;
    var box = document.getElementById("tl-outs");
    if(!box) return;
    box.innerHTML = "";
    tele.outs.forEach(function(o){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tbtn out";
      b.dataset.act = "out";
      b.dataset.id = o.id;
      b.textContent = (o.name || "uscita senza nome") + (o.manufacturer ? " · " + o.manufacturer : "");
      box.appendChild(b);
    });
  }

  /* aggiorna solo quello che cambia, senza ricostruire i tasti */
  function tlPaint(){
    if(state.dev !== "tele") return;
    var st = document.getElementById("tl-state");
    if(!st) return;
    st.textContent = tlStatus();
    var m = document.getElementById("tl-msg");
    m.textContent = tele.msg;
    m.hidden = !tele.msg;
    var cb = document.getElementById("tl-connect");
    cb.parentNode.hidden = !tlSupported();
    cb.textContent = tele.access ? "ricollega" : "collega";
    document.getElementById("tl-outs-wrap").hidden = !tele.outs.length;
    elContent.querySelectorAll("[data-act='out']").forEach(function(b){
      b.setAttribute("aria-pressed", tele.out && b.dataset.id === tele.out.id ? "true" : "false");
    });
    document.getElementById("tl-chv").textContent = "canale " + tele.ch;
    document.getElementById("tl-chs").textContent = "canale " + tele.ch;
    var dev = DATA[tele.model];
    document.getElementById("tl-facename").textContent = dev.name;
    elContent.querySelectorAll(".tl-top").forEach(function(e){ e.textContent = dev.topLabel; });
    document.getElementById("tl-toppad").setAttribute("aria-label", dev.topLabel);
    elContent.querySelectorAll("[data-act='model']").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.m === tele.model ? "true" : "false");
    });
    elContent.querySelectorAll(".pad[data-n]").forEach(function(p){
      var n = +p.dataset.n, on = tlIsHeld(n);
      var latch = p.dataset.kind === "fn" || (p.dataset.kind === "num" && tele.nums);
      if(latch || on) p.setAttribute("aria-pressed", on ? "true" : "false");
      else p.removeAttribute("aria-pressed");
    });
    var nb = document.getElementById("tl-nums");
    nb.setAttribute("aria-pressed", tele.nums ? "true" : "false");
    nb.textContent = "tieni anche i numeri: " + (tele.nums ? "sì" : "no");
    document.getElementById("tl-release").textContent = "lascia tutto" + (tele.held.length ? " (" + tele.held.length + ")" : "");
    document.getElementById("tl-log").innerHTML = tele.log.length ?
      tele.log.map(function(l){ return "<li>" + esc(l) + "</li>"; }).join("") : "<li>ancora niente</li>";
  }

  function renderTele(){
    document.documentElement.setAttribute("data-po", "tele");
    if(!tele.model) tele.model = state.lastDev || "ko";

    function pad(n, kind, label, name){
      return "<button type='button' class='pad " + kind + "' data-act='pad' data-kind='" + kind + "' data-n='" + n + "' aria-label='" + name + "'>" +
             "<span class='lb'>" + label + "</span><span class='pn'>" + n + "</span></button>";
    }
    function knob(x){
      return "<button type='button' class='pad knob' disabled aria-label='manopola " + x + ", non via MIDI'>" +
             "<span class='lb'>" + x + "</span><span class='pn'>non via<br>MIDI</span></button>";
    }
    function numRow(title, first){
      var s = "<div class='grp'><h3>" + title + "</h3><div class='numpad' role='group' aria-label='" + title + "'>";
      for(var i = 1; i <= 16; i++){
        s += "<button type='button' class='nbtn' data-act='combo' data-seq='" + first + "," + noteOfNum(i) + "' aria-label='" + title + " " + i + "'>" + i + "</button>";
      }
      return s + "</div></div>";
    }

    var face = pad(76, "fn", "sound", "sound") + pad(77, "fn", "pattern", "pattern") + pad(81, "fn", "bpm", "bpm") + knob("A") + knob("B");
    var right = ["top", "fx", "play", "write"];
    for(var r = 0; r < 4; r++){
      for(var c = 1; c <= 4; c++){ var k = r * 4 + c; face += pad(noteOfNum(k), "num", String(k), "tasto " + k); }
      if(right[r] === "top"){
        face += "<button type='button' class='pad fn' id='tl-toppad' data-act='pad' data-kind='fn' data-n='79' aria-label='record'>" +
                "<span class='lb tl-top'>record</span><span class='pn'>79</span></button>";
      }
      else if(right[r] === "play") face += pad(78, "play", "play ▶", "play");
      else face += pad(FN_NOTE[right[r]], "fn", right[r], right[r]);
    }

    var models = ORDER.map(function(k){
      return "<button type='button' class='tbtn' data-act='model' data-m='" + k + "'>" + DATA[k].name + "</button>";
    }).join("");

    var h = "<div class='tele'>";

    h += "<section class='tl-conn'><h2 class='sec'>collegare</h2>" +
      "<div class='card tl-card'>" +
        "<div role='status' aria-live='polite'><p class='tl-state' id='tl-state'></p><p class='tl-msg' id='tl-msg' hidden></p></div>" +
        "<div class='tl-row'><button type='button' class='tbtn main' id='tl-connect' data-act='connect'>collega</button></div>" +
        "<div id='tl-outs-wrap' hidden><p class='tl-lab'>uscite midi trovate</p><div class='tl-outs' id='tl-outs' role='group' aria-label='uscite MIDI'></div></div>" +
        "<div class='tl-ch' role='group' aria-label='canale MIDI'>" +
          "<button type='button' class='tbtn sq' data-act='ch' data-d='-1' aria-label='canale meno'>−</button>" +
          "<b id='tl-chv'>canale 1</b>" +
          "<button type='button' class='tbtn sq' data-act='ch' data-d='1' aria-label='canale più'>+</button>" +
        "</div>" +
      "</div>" +
      "<p class='note'>Col cavo USB l'adattatore compare da solo come «Teensy MIDI». Col bluetooth, sul Mac va prima collegato: <b>Configurazione MIDI Audio → Finestra → Mostra finestra MIDI → icona del bluetooth</b>, e lì scegli l'adattatore.</p>" +
      "</section>";

    h += "<section class='tl-face-sec'><h2 class='sec'>la faccia del po</h2>" +
      "<p class='sec-note'>I tasti funzione restano giù finché non li ritocchi: così fai le combinazioni un tocco alla volta. I numeri e play fanno un tocco di 60 ms.</p>" +
      "<div class='tl-models' role='group' aria-label='modello del PO'>" + models + "</div>" +
      "<div class='face'><div class='silkrow'><b id='tl-facename'>po</b><span>telecomando · <span id='tl-chs'>canale 1</span></span></div>" +
        "<div class='face-grid'>" + face + "</div></div>" +
      "<div class='tl-row'>" +
        "<button type='button' class='tbtn' id='tl-nums' data-act='nums'>tieni anche i numeri: no</button>" +
        "<button type='button' class='tbtn' id='tl-release' data-act='release'>lascia tutto</button>" +
      "</div>" +
      "<p class='note'>«Tieni anche i numeri» serve per fx + un tasto, che vale finché il tasto è giù, e per campionare con record + un tasto. A e B non si comandano via MIDI. Il telecomando non vede il display del PO: ricorda solo quello che ha mandato.</p>" +
      "</section>";

    h += "<section class='tl-log-sec'><h2 class='sec'>ultimi messaggi</h2>" +
      "<ol class='tl-log' id='tl-log'></ol>" +
      "<p class='note'>Gli ultimi 8, in byte: 9x = nota accesa, 8x = nota spenta (x = canale meno uno), poi il numero della nota e la forza, in esadecimale.</p>" +
      "</section>";

    h += "<section class='tl-combo'><h2 class='sec'>combinazioni pronte</h2>" +
      "<p class='sec-note'>Un tocco fa tutta la combinazione. Per «pattern 5» partono: pattern giù, 5 giù, 5 su, pattern su, a 25 ms l'uno dall'altro.</p>" +
      numRow("pattern", FN_NOTE.pattern) +
      numRow("suono", FN_NOTE.sound) +
      numRow("volume", FN_NOTE.bpm) +
      "<p class='note'>Volume: con le cuffie non andare oltre 5.</p>" +
      "<div class='grp'><h3>tempo e sync</h3><div class='tl-row'>" +
        "<button type='button' class='tbtn' data-act='tap' data-n='81'>tempo preset (bpm)</button>" +
        "<button type='button' class='tbtn' data-act='combo' data-seq='79,81'>cambia sync (<span class='tl-top'>record</span> + bpm)</button>" +
      "</div></div>" +
      "<p class='note'>«Tempo preset» cicla 80 · 120 · 140. «Cambia sync» cicla SY0-SY5: guarda il display del PO. Per stare a tempo col TX-6 serve SY2.</p>" +
      "</section>";

    h += "</div>";
    elContent.innerHTML = h;
    tlPaintOuts();
    tlPaint();
  }

  /* i tasti del telecomando: un ascoltatore solo, che resta anche quando il contenuto cambia */
  elContent.addEventListener("click", function(e){
    if(state.dev !== "tele") return;
    var b = e.target.closest("[data-act]");
    if(!b || b.disabled) return;
    var a = b.dataset.act;
    if(a === "connect") tlConnect();
    else if(a === "out") tlPick(b.dataset.id);
    else if(a === "ch") tlChannel(+b.dataset.d);
    else if(a === "model"){ tele.model = b.dataset.m; tlPaint(); }
    else if(a === "pad") tlPad(+b.dataset.n, b.dataset.kind, b);
    else if(a === "nums"){ tele.nums = !tele.nums; tlPaint(); }
    else if(a === "release") tlReleaseAll(false, true);
    else if(a === "combo") tlCombo(b.dataset.seq.split(",").map(Number), b);
    else if(a === "tap") tlTap(+b.dataset.n, b);
  });
  /* chiudendo la pagina: nessun tasto del PO resta giù */
  window.addEventListener("pagehide", function(){ tlReleaseAll(true, false); });
  window.addEventListener("beforeunload", function(){ tlReleaseAll(true, false); });

  function render(keepFocus){
    TABS.forEach(function(k){
      var t = elTabs.querySelector('[data-k="' + k + '"]');
      t.setAttribute("aria-selected", state.dev === k ? "true" : "false");
    });
    elUnit.classList.toggle("midi", state.dev === "midi");
    elWrap.classList.toggle("solo", state.dev === "tele");
    document.getElementById("brandnote").textContent = BRANDNOTE[state.dev] || BRANDNOTE_DEF;
    if(state.dev === "tutti") renderCompare();
    else if(state.dev === "midi") renderMidi();
    else if(state.dev === "tele") renderTele();
    else renderDevice(state.dev);
    if(keepFocus){
      var q = document.getElementById("q");
      if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
  }

  try{
    render();
  }catch(err){
    elContent.innerHTML = '<section><h2 class="sec">qualcosa non ha funzionato</h2>' +
      '<p class="sec-note">La pagina non è riuscita a costruire l\'elenco: ' + esc(String(err && err.message || err)) + '</p></section>';
  }
})();
</script>

</html>
